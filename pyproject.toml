[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitch90"
version = "0.1.0"
description = "90-second pitch narrative test and investor one-pager generator for pitch decks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.125,<2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "reportlab>=4.2",
    "pillow>=10",
    "numpy>=1.26",
    "rapidocr-onnxruntime>=1.2",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
